<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/desktop.css">
  <link rel="stylesheet" href="/css/window.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <div id="topbar">
      <span class="logo">✦ WORKSPACE</span>
      <span class="ws-label">Workspace:</span>
      <div id="ws-dropdown">
        <span id="ws-name">Loading...</span>
        <div id="ws-list"></div>
      </div>
      <span id="reconnecting-indicator" class="reconnecting hidden">⟳ reconnecting...</span>
      <div class="topbar-spacer"></div>
      <button class="topbar-btn" id="btn-new-ws">+ New</button>
    </div>

    <!-- Canvas -->
    <div id="canvas-container">
      <div id="canvas">
        <div id="welcome-placeholder" class="hidden">
          <div class="welcome-content">
            <h1>Welcome to your workspace</h1>
            <p>Drag files here to open, or get started with:</p>
            <div class="welcome-actions">
              <button class="welcome-btn" data-action="markdown">New Markdown</button>
              <button class="welcome-btn" data-action="text">New Text</button>
              <button class="welcome-btn" data-action="upload">Upload File</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="hidden">
      <div class="menu-item" data-action="markdown">New Markdown</div>
      <div class="menu-item" data-action="text">New Text</div>
      <div class="menu-item" data-action="html">New HTML</div>
      <div class="menu-item" data-action="search">Search Files</div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="upload">Upload File</div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Dock -->
    <div id="dock">
      <button class="dock-btn" id="btn-new-window" title="New Window">+</button>
      <div id="new-window-menu">
        <div class="menu-item" data-wnd-type="markdown">Markdown</div>
        <div class="menu-item" data-wnd-type="text">Text</div>
        <div class="menu-item" data-wnd-type="html">HTML</div>
        <div class="menu-item" data-wnd-type="image">Image Viewer</div>
        <div class="menu-item" data-wnd-type="explorer">File Explorer</div>
        <div class="menu-item" data-wnd-type="search">Search</div>
        <div class="menu-item" data-wnd-type="tabbed">Tabbed Group</div>
      </div>
      <input type="file" id="file-upload-input" style="display:none">
      <button class="dock-btn" id="btn-upload" title="Upload">↑</button>
      <button class="dock-btn" id="btn-search" title="Search">⌕</button>
      <div id="dock-minimized" style="display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;margin-left:8px"></div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay">
      <div id="modal">
        <h2 id="modal-title">New Workspace</h2>
        <input type="text" id="ws-name-input" placeholder="Workspace name...">
        <div class="modal-actions">
          <button class="modal-btn" id="btn-create-ws">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/state.js"></script>
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/ws.js"></script>
  <script type="module" src="/js/canvas.js"></script>
  <script type="module" src="/js/titlebar.js"></script>
  <script type="module" src="/js/resize.js"></script>
  <script type="module" src="/js/window-factory.js"></script>
  <script type="module" src="/js/window-manager.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
